name: build

on:
  pull_request:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uvx ruff check src tests
      - run: uvx ruff format --check src tests
      # Generated stubs must match the committed proto.
      - run: ./scripts/gen-grpc.sh && git diff --exit-code src/emulator_hub/_grpc
      - run: uv run pytest -q

  # DISABLED: the e2e suite. Three jobs lived here: catalog-matrix and
  # emulator-image (the tests/e2e/test_image.py contract, one run per catalog
  # entry, on every PR and push) and e2e (which called
  # .github/workflows/e2e.yml to gate releases). With them gone, `image` no
  # longer waits on e2e before publishing. `git revert` this commit to restore
  # all three.

  image:
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - {image: emulator-hub, context: ., file: Dockerfile}
          - {image: emulator-hub-emulator, context: emulator, file: emulator/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/noahchalifour/${{ matrix.image }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
